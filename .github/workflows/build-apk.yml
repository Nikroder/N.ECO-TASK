name: Build Android APK and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release N.ECO TASK APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/N.ECO-TASK.apk
          echo "APK generated successfully at release-artifacts/N.ECO-TASK.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: N.ECO-TASK-APK
          path: release-artifacts/N.ECO-TASK.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'N.ECO TASK v1.0.0' }}
          body: |
            ### 🚀 N.ECO TASK — Автоматическая сборка для Android
            
            **Что нового:**
            * Полноценный планировщик задач, календарь и тайм-блокинг.
            * Трекер привычек с картой дисциплины (Heatmap).
            * Глубокий фокус (Pomodoro) и звуки окружения.
            * Интерактивные виджеты на рабочем столе Android (Jetpack Glance).
            * Встроенный модуль автообновлений прямо из GitHub Releases!
            
            **Установка:**
            Скачайте прикрепленный файл `N.ECO-TASK.apk` на Android-устройство и установите.
          files: release-artifacts/N.ECO-TASK.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
